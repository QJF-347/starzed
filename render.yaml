services:
  # Unified Frontend + Backend Service - Cache bust: v33
  - type: web
    name: starzed
    env: python
    plan: free
    buildCommand: npm install && npm run build && pip install -r requirements.txt && cd src && python manage.py makemigrations && python manage.py migrate && python manage.py collectstatic --noinput && cp -r ../dist . || echo "Dist folder copy attempted"
    startCommand: python django_backend.py
    healthCheckPath: /api/health/

databases:
  - name: starzed-db
    databaseName: starzed
    user: starzed_user
    plan: free
